<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../supabase.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F6F5F2">
  <title>Nook Café — Snyf</title>
  <meta name="description" content="Order from Nook Café on Snyf. Verified trust scores. Real menu. Scan and order.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@700;900&display=swap" rel="stylesheet">
  <style>
    /* ── Reset + Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:     #1E1E1B;
      --muted:   #6E6A64;
      --paper:   #F6F5F2;
      --white:   #FFFFFF;
      --border:  #D8D5CF;
      --hover:   #ECE9E2;
      --cyan:    #6FB7D6;
      --mint:    #7BC6A4;
      --orange:  #D97A4A;
      --gold:    #D4A853;
      --surface: rgba(255,255,255,0.72);
      --mono:    'JetBrains Mono', monospace;
      --display: 'Oswald', Impact, sans-serif;
      --sans:    'Inter', system-ui, sans-serif;
      --max-w:   430px;
      --radius:  20px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button { cursor: pointer; font: inherit; border: none; background: none; }
    img { display: block; max-width: 100%; }
    input { font: inherit; }

    /* ── Page wrapper — centered max-width on desktop ── */
    .vp-root {
      max-width: var(--max-w);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--paper);
      position: relative;
    }

    /* On desktop — add subtle shadow to show mobile frame */
    @media (min-width: 500px) {
      body { background: #E8E6E1; }
      .vp-root {
        box-shadow: 0 0 60px rgba(30,30,27,0.15);
        min-height: 100vh;
      }
    }

    /* ── Screen system ── */
    .vp-screen {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }
    .vp-screen.active {
      display: flex;
    }

    /* ── MENU SCREEN ─────────────────────────────────── */

    /* Hero image */
    .menu-hero {
      position: relative;
      height: 240px;
      overflow: hidden;
      background: var(--hover);
      flex-shrink: 0;
    }

    .menu-hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .menu-hero:hover .menu-hero-img {
      transform: scale(1.03);
    }

    /* Gradient overlay on hero */
    .menu-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(30,30,27,0.4));
      pointer-events: none;
    }

    /* Top bar on hero — back button + snyf badge */
    .menu-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }

    .menu-back-btn {
      width: 36px; height: 36px;
      background: rgba(246,245,242,0.88);
      backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--ink);
      text-decoration: none;
      border: 1px solid rgba(30,30,27,0.1);
      transition: all 0.18s;
    }

    .menu-back-btn:hover { background: var(--paper); }

    .menu-snyf-badge {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mint);
      background: rgba(30,30,27,0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(123,198,164,0.35);
      padding: 4px 10px;
      border-radius: 4px;
    }

    /* Venue profile card — overlaps hero bottom */
    .menu-profile {
      position: relative;
      margin: -48px 16px 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 4px 24px rgba(30,30,27,0.08);
      z-index: 1;
      flex-shrink: 0;
    }

    .menu-profile-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 12px;
    }

    .menu-logo {
      width: 52px; height: 52px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--hover);
    }

    .menu-logo-placeholder {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--cyan), #A59BB7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-size: 1.4rem;
      font-weight: 900;
      color: white;
      flex-shrink: 0;
    }

    .menu-venue-name {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .menu-venue-tags {
      font-size: 12px;
      color: var(--muted);
    }

    .menu-venue-desc {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.65;
    }

    /* Snyf trust message box */
    .menu-trust-box {
      margin: 14px 16px 0;
      background: rgba(111,183,214,0.06);
      border: 1px solid rgba(111,183,214,0.2);
      border-radius: 14px;
      padding: 16px;
      flex-shrink: 0;
    }

    .menu-trust-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .menu-trust-logo {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.3px;
    }

    .menu-trust-verified {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.12em;
      color: var(--mint);
      background: rgba(123,198,164,0.12);
      border: 1px solid rgba(123,198,164,0.3);
      padding: 2px 7px;
      border-radius: 4px;
    }

    /* 5 trust score mini bars in trust box */
    .menu-trust-dims {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .menu-trust-dim {
      display: grid;
      grid-template-columns: 58px 1fr 26px;
      align-items: center;
      gap: 8px;
    }

    .menu-trust-dim-label {
      font-size: 10px;
      color: var(--muted);
      text-align: right;
    }

    .menu-trust-dim-track {
      height: 4px;
      background: rgba(30,30,27,0.07);
      border-radius: 2px;
      overflow: hidden;
    }

    .menu-trust-dim-fill {
      height: 100%;
      background: var(--cyan);
      border-radius: 2px;
      width: 0%;
      transition: width 1s cubic-bezier(0.22,1,0.36,1);
    }

    .menu-trust-dim-fill--bad { background: var(--orange); }

    .menu-trust-dim-val {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--ink);
      text-align: right;
    }

    .menu-trust-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .menu-trust-overall {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .menu-trust-score {
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--cyan);
      letter-spacing: -1px;
    }

    .menu-trust-denom {
      font-size: 11px;
      color: var(--muted);
    }

    .menu-trust-count {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* Category tabs */
    .menu-cats {
      margin-top: 20px;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .menu-cats-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }

    .menu-cats-scroll::-webkit-scrollbar { display: none; }

    .menu-cat-btn {
      padding: 9px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .menu-cat-btn.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #F6F5F2;
    }

    .menu-cat-btn:hover:not(.active) {
      background: var(--hover);
      color: var(--ink);
    }

    /* Dish list */
    .menu-dishes {
      flex: 1;
      padding: 16px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Dish card */
    .dish-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .dish-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(30,30,27,0.08);
    }

    .dish-img-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: var(--hover);
    }

    .dish-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .dish-card:hover .dish-img { transform: scale(1.04); }

    .dish-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: var(--mono);
      font-size: 8.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
      background: rgba(246,245,242,0.92);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(30,30,27,0.12);
      padding: 3px 9px;
      border-radius: 4px;
    }

    .dish-tag--popular {
      color: var(--orange);
      border-color: rgba(217,122,74,0.3);
      background: rgba(246,245,242,0.92);
    }

    .dish-tag--veg {
      color: var(--mint);
      border-color: rgba(123,198,164,0.3);
    }

    .dish-tag--bestseller {
      color: var(--gold);
      border-color: rgba(212,168,83,0.3);
    }

    .dish-body {
      padding: 16px;
    }

    .dish-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 5px;
      line-height: 1.3;
    }

    .dish-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .dish-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dish-price {
      font-family: var(--display);
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .dish-price-sub {
      font-size: 10px;
      color: var(--muted);
      font-family: var(--mono);
    }

    /* Add to cart button */
    .dish-add-btn {
      width: 36px; height: 36px;
      background: var(--ink);
      color: #F6F5F2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      transition: all 0.18s;
      flex-shrink: 0;
    }

    .dish-add-btn:hover {
      background: #2d2d29;
      transform: scale(1.08);
    }

    .dish-add-btn.in-cart {
      background: var(--mint);
    }

    /* Quantity controls replace + button when in cart */
    .dish-qty-ctrl {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--ink);
      border-radius: 999px;
      overflow: hidden;
    }

    .dish-qty-btn {
      width: 32px; height: 32px;
      background: transparent;
      color: #F6F5F2;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dish-qty-num {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      color: #F6F5F2;
      min-width: 22px;
      text-align: center;
    }

    /* Sticky view order bar */
    .menu-order-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-w);
      padding: 14px 16px;
      background: rgba(246,245,242,0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
    }

    .menu-order-bar.hidden {
      transform: translateX(-50%) translateY(100%);
    }

    .menu-order-btn {
      width: 100%;
      height: 52px;
      background: var(--ink);
      color: #F6F5F2;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.18s;
    }

    .menu-order-btn:hover { background: #2d2d29; }

    .menu-order-count {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--cyan);
      color: var(--ink);
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 700;
    }

    .menu-order-total {
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(246,245,242,0.6);
      margin-left: auto;
    }

    /* ── CART SCREEN ──────────────────────────────────── */
    .cart-header {
      position: sticky;
      top: 0;
      background: rgba(246,245,242,0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
      flex-shrink: 0;
    }

    .cart-back-btn {
      width: 36px; height: 36px;
      background: var(--hover);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--ink);
      flex-shrink: 0;
      transition: all 0.18s;
    }

    .cart-back-btn:hover { background: var(--border); }

    .cart-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--ink);
    }

    .cart-subtitle {
      font-size: 12px;
      color: var(--muted);
    }

    .cart-body {
      flex: 1;
      padding: 20px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
    }

    .cart-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--muted);
      padding: 60px 20px;
      text-align: center;
    }

    .cart-empty-icon {
      font-size: 2.5rem;
      opacity: 0.4;
    }

    /* Cart item */
    .cart-item {
      display: flex;
      gap: 12px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(30,30,27,0.06);
      align-items: center;
    }

    .cart-item:last-child { border-bottom: none; }

    .cart-item-img {
      width: 68px; height: 68px;
      border-radius: 12px;
      object-fit: cover;
      background: var(--hover);
      flex-shrink: 0;
    }

    .cart-item-info { flex: 1; min-width: 0; }

    .cart-item-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-price {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .cart-item-ctrl {
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--hover);
      border-radius: 999px;
      overflow: hidden;
      width: fit-content;
    }

    .cart-item-ctrl-btn {
      width: 28px; height: 28px;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-item-ctrl-num {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--ink);
      min-width: 20px;
      text-align: center;
    }

    .cart-item-remove {
      color: rgba(217,122,74,0.6);
      font-size: 16px;
      padding: 4px;
      flex-shrink: 0;
      transition: color 0.18s;
    }

    .cart-item-remove:hover { color: var(--orange); }

    /* Special instructions */
    .cart-section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin: 20px 0 12px;
    }

    .cart-instruction-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }

    .cart-chip {
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      transition: all 0.18s;
    }

    .cart-chip.active {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--ink);
    }

    .cart-custom-input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.7);
      color: var(--ink);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .cart-custom-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(111,183,214,0.1);
    }

    /* Order summary */
    .cart-summary {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-top: 20px;
    }

    .cart-summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      padding: 5px 0;
    }

    .cart-summary-divider {
      height: 1px;
      background: var(--border);
      margin: 10px 0;
    }

    .cart-summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
    }

    .cart-est-time {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      margin-top: 14px;
    }

    /* Cart confirm bar */
    .cart-confirm-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: var(--max-w);
      padding: 14px 16px;
      background: rgba(246,245,242,0.92);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      z-index: 30;
    }

    .cart-confirm-btn {
      width: 100%;
      height: 52px;
      background: var(--ink);
      color: #F6F5F2;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      transition: background 0.18s;
    }

    .cart-confirm-btn:hover { background: #2d2d29; }

    /* ── ORDER TRACKING SCREEN ─────────────────────────── */
    .track-root {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 20px 40px;
      background: var(--paper);
      position: relative;
      overflow: hidden;
    }

    /* Subtle grid background */
    .track-root::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,30,27,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,30,27,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent 70%);
      pointer-events: none;
    }

    /* Floating ambient dots */
    .track-dots {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .track-dot {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      opacity: 0.15;
      animation: track-float linear infinite;
    }

    @keyframes track-float {
      0%   { transform: translateY(0) scale(1); opacity: 0.15; }
      50%  { transform: translateY(-20px) scale(1.2); opacity: 0.35; }
      100% { transform: translateY(0) scale(1); opacity: 0.15; }
    }

    /* Timer circle */
    .track-timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
      position: relative;
      z-index: 1;
    }

    .track-circle {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(111,183,214,0.08);
      border: 2px solid rgba(111,183,214,0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      animation: track-pulse 2.5s ease-in-out infinite;
    }

    @keyframes track-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(111,183,214,0.2); }
      50%       { transform: scale(1.03); box-shadow: 0 0 0 12px rgba(111,183,214,0); }
    }

    .track-mins {
      font-family: var(--display);
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--ink);
      line-height: 1;
      letter-spacing: -2px;
    }

    .track-mins-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .track-heading {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .track-subhead {
      font-size: 13px;
      color: var(--muted);
    }

    /* Progress bar */
    .track-progress-wrap {
      max-width: 340px;
      width: 100%;
      margin: 0 auto 20px;
      position: relative;
      z-index: 1;
    }

    .track-progress-bar {
      height: 3px;
      background: var(--hover);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .track-progress-fill {
      height: 100%;
      background: linear-gradient(to right, var(--cyan), var(--mint));
      border-radius: 2px;
      transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
      width: 0%;
    }

    /* Order states */
    .track-states {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .track-state {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
      background: rgba(255,255,255,0.4);
    }

    .track-state.state-active {
      background: rgba(111,183,214,0.08);
      border-color: rgba(111,183,214,0.25);
    }

    .track-state.state-done {
      background: rgba(123,198,164,0.06);
      opacity: 0.7;
    }

    .track-state-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      background: var(--hover);
      color: var(--muted);
      border: 1.5px solid var(--border);
      transition: all 0.3s ease;
    }

    .track-state.state-active .track-state-icon {
      background: rgba(111,183,214,0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .track-state.state-done .track-state-icon {
      background: var(--mint);
      border-color: var(--mint);
      color: white;
    }

    .track-state-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      transition: color 0.3s;
    }

    .track-state.state-active .track-state-label { color: var(--cyan); }
    .track-state.state-done .track-state-label   { color: var(--mint); }

    /* Inline review sliders */
    .track-review {
      max-width: 340px;
      width: 100%;
      margin: 28px auto 0;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
      position: relative;
      z-index: 1;
      display: none;
    }

    .track-review.visible { display: block; }

    .track-review-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--ink);
      margin-bottom: 20px;
      text-align: center;
    }

    .track-slider-row {
      margin-bottom: 18px;
    }

    .track-slider-meta {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .track-slider-label {
      font-size: 12px;
      color: var(--muted);
    }

    .track-slider-val {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      color: var(--cyan);
    }

    .track-slider {
      width: 100%;
      height: 4px;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .track-back-btn {
      width: 100%;
      height: 46px;
      background: var(--hover);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 20px;
      transition: all 0.18s;
    }

    .track-back-btn:hover {
      background: var(--border);
      color: var(--ink);
    }

    /* ── Snyf footer ── */
    .vp-footer {
      text-align: center;
      padding: 16px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      color: rgba(110,106,100,0.4);
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .vp-footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    /* ── Toast notification ── */
    .vp-toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #F6F5F2;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 999px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
      white-space: nowrap;
      max-width: calc(var(--max-w) - 40px);
    }

    .vp-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Animations ── */
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .anim-slide-up {
      animation: slide-up 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }

    /* Stagger dishes */
    .dish-card { opacity: 0; }
    .dish-card.visible {
      animation: slide-up 0.4s cubic-bezier(0.22,1,0.36,1) both;
      opacity: 1;
    }

    /* ══════════════════════════════════════════════════════
       DESKTOP WRAPPER — only fires above 500px
       Mobile experience is completely unchanged below 500px
       ══════════════════════════════════════════════════════ */

    @media (min-width: 500px) {

      /* Grid texture + centered layout on desktop */
      body {
        background-color: #E8E6E1;
        background-image:
          linear-gradient(rgba(30,30,27,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(30,30,27,0.035) 1px, transparent 1px);
        background-size: 48px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding-top: 52px;
        padding-bottom: 60px;
      }

      /* Ambient cyan glow behind phone column */
      body::before {
        content: '';
        position: fixed;
        top: -80px;
        left: 50%;
        transform: translateX(-50%);
        width: 560px;
        height: 560px;
        background: radial-gradient(
          circle,
          rgba(111,183,214,0.2) 0%,
          rgba(111,183,214,0.06) 45%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
        animation: desktop-glow-drift 12s ease-in-out infinite;
      }

      @keyframes desktop-glow-drift {
        0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.9; }
        50%       { transform: translateX(-50%) translateY(20px); opacity: 1; }
      }

      /* Hint bar at top — contextualizes the page for desktop visitors */
      body::after {
        content: '📱  Best experienced on mobile · Scan the QR code on your table';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        color: rgba(110,106,100,0.55);
        background: rgba(246,245,242,0.82);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(30,30,27,0.07);
        padding: 10px 20px;
        z-index: 200;
        pointer-events: none;
      }

      /* Phone column — wider + rounded + shadow */
      .vp-root {
        max-width: 480px;
        width: 100%;
        border-radius: 28px;
        overflow: hidden;
        position: relative;
        z-index: 1;

        /* Layered shadow — makes it look like a phone sitting on a surface */
        box-shadow:
          0 0 0 1px rgba(30,30,27,0.07),
          0 2px 6px rgba(30,30,27,0.06),
          0 8px 24px rgba(30,30,27,0.1),
          0 24px 60px rgba(30,30,27,0.16);
      }

      /* Fix: sticky bottom bars need to respect the centered column on desktop */
      .menu-order-bar,
      .cart-confirm-bar {
        left: 50%;
        transform: translateX(-50%);
        max-width: 480px;
        border-radius: 0 0 28px 28px;
      }

      /* Fix: order bar hidden state — keep transform consistent */
      .menu-order-bar.hidden {
        transform: translateX(-50%) translateY(100%);
      }

    }

    /* ── iOS safe area insets ── */
    /* Applies on all screen sizes for notched iPhones */
    .menu-order-bar,
    .cart-confirm-bar {
      padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    }

    /* ── iOS input zoom prevention ── */
    /* Any input font-size below 16px causes iOS Safari to auto-zoom */
    .cart-custom-input {
      font-size: 16px;
    }

    /* ── Touch target minimum sizes ── */
    /* Apple HIG + Google Material both require 44px minimum touch targets */
    .dish-add-btn {
      min-width: 44px;
      min-height: 44px;
    }

    .cart-item-ctrl-btn {
      min-width: 44px;
      min-height: 44px;
    }

    /* ── Momentum scrolling on iOS ── */
    .menu-cats-scroll,
    .cart-body {
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>

<body>

        <!-- Timer -->

              id="sl-ambience" oninput="updateSlider('ambience', this.value)">

  <script>
  // ══════════════════════════════════════════
  // VENUE DATA — Change this block per venue
  // ══════════════════════════════════════════
  // ══════════════════════════════════════════
  // VENUE DATA — Dynamic loader + hardcoded fallbacks
  // ══════════════════════════════════════════
  const HARDCODED_FALLBACK_CATEGORIES = ['Recommended', 'Coffee', 'Breakfast', 'Snacks', 'Cold Drinks'];
  const HARDCODED_FALLBACK_MENU = [
    {
      id: 'nc1',
      name: 'Butter Croissant',

    },
    {

      price: 280,
      category: 'Breakfast',
      tag: 'Veg',
      img: 'https://images.unsplash.com/photo-1541519227354-08fa5d50c820?w=600&q=80',
    },
    {

    {

    },
    {

      name: 'Cold Brew Lemonade',
      desc: '18-hour cold brew cut with fresh lime and a pinch of salt.',
      price: 200,
      category: 'Cold Drinks',
      img: 'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600&q=80',
    },
    {
      id: 'nc7',
      name: 'Egg Bhurji Toast',
      desc: 'Spiced scrambled eggs on toasted multigrain. The local favourite.',
      price: 220,
      category: 'Breakfast',
      tag: 'Popular',
      img: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=600&q=80',
    },
    {
      id: 'nc8',
      name: 'Mango Lassi',
      desc: 'Fresh Alphonso mango, hung curd, a hint of cardamom.',
      price: 180,
      category: 'Cold Drinks',
      img: 'https://images.unsplash.com/photo-1553361371-9b22f78e8b1d?w=600&q=80',
    },
  ];

  let VENUE_DATA = null;

  async function loadVenueDetails() {
    const slug = window.location.pathname.split('/').filter(Boolean).pop() || 'nook-cafe';
    try {
      const { data: row, error } = await db
        .from('venues')
        .select('*')
        .eq('slug', slug)
        .eq('status', 'active')
        .single();
      if (error) throw error;
      if (!row) throw new Error('No active venue found with slug: ' + slug);

      VENUE_DATA = {
        id: row.id,
        name: row.name,
        logoLetter: row.logo_letter || row.name.charAt(0),
        tags: row.tags || (row.category + ' · ' + row.zone),
        desc: row.description || row.tagline || '',
        heroImg: row.hero_img || 'https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?w=800&q=80',
        scores: {
          food: parseFloat(row.score_food) || 5.0,
          ambience: parseFloat(row.score_ambience) || 5.0,
          service: parseFloat(row.score_service) || 5.0,
          value: parseFloat(row.score_value) || 5.0,
          wait: parseFloat(row.score_wait) || 5.0,
        },
        verifiedCount: `${row.verified_count || 0} verified visits`,
        categories: HARDCODED_FALLBACK_CATEGORIES,
        menu: []
      };

      // Try fetching menu items
      try {
        const { data: menuRows, error: menuErr } = await db
          .from('menu_items')
          .select('*')
          .eq('venue_id', row.id);
        if (!menuErr && menuRows && menuRows.length > 0) {
          VENUE_DATA.menu = menuRows.map(m => ({
            id: m.id,
            name: m.name,
            desc: m.description || m.desc || '',
            price: parseFloat(m.price) || 0,
            category: m.category || 'Coffee',
            tag: m.tag || null,
            img: m.image_url || m.img || '☕',
            available: m.available !== false
          }));
          const cats = new Set(['Recommended']);
          menuRows.forEach(m => { if (m.category) cats.add(m.category); });
          VENUE_DATA.categories = Array.from(cats);
        }
      } catch (me) {
        console.warn('Failed to load menu items:', me);
      }

      if (!VENUE_DATA.menu || VENUE_DATA.menu.length === 0) {
        VENUE_DATA.menu = HARDCODED_FALLBACK_MENU;
        VENUE_DATA.categories = HARDCODED_FALLBACK_CATEGORIES;
      }
    } catch (err) {
      console.warn('Supabase load failed, using local fallback:', err);
      VENUE_DATA = {
        name: 'Nook Café',
        logoLetter: 'N',
        tags: 'Specialty Café · Sector 29 · Hidden Gem',
        desc: 'Tucked behind the main strip. Exceptional croissants, best value breakfast in Sector 29, and a space that actually lets you think.',
        heroImg: 'https://images.unsplash.com/photo-1600093463592-8e36ae95ef56?w=800&q=80',
        scores: { food: 9.0, ambience: 7.6, service: 8.4, value: 9.1, wait: 8.2 },
        verifiedCount: '318 verified visits',
        categories: HARDCODED_FALLBACK_CATEGORIES,
        menu: HARDCODED_FALLBACK_MENU
      };
    }
    populateUI();
  }

  function populateUI() {
    // Populate hero
    document.getElementById('hero-img').src = VENUE_DATA.heroImg;
    document.getElementById('hero-img').alt = VENUE_DATA.name;
    document.getElementById('venue-logo-placeholder').textContent = VENUE_DATA.logoLetter;
    document.getElementById('venue-name').textContent = VENUE_DATA.name;
    document.getElementById('venue-tags').textContent = VENUE_DATA.tags;
    document.getElementById('venue-desc').textContent = VENUE_DATA.desc;

    // Trust score
    const overall = calcOverall(VENUE_DATA.scores);
    document.getElementById('trust-score').textContent = overall.toFixed(1);
    document.getElementById('trust-count').textContent = VENUE_DATA.verifiedCount;
    renderTrustDims();

    // Category tabs
    renderCats();

    // Dishes
    renderDishes();
  }

  // ══════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════
  let cart = {}; // { id: { item, qty } }
  let activeCategory = 'Recommended';
  let trackInterval = null;
  let trackTimeInterval = null;
  let trackState = 0;
  let minsLeft = 24;

  const ORDER_STATES = [
    { label: 'Order Received',   icon: '✓' },
    { label: 'Preparing',        icon: '🍳' },
    { label: 'Plating',          icon: '🍽' },
    { label: 'Ready to Serve',   icon: '✓' },
  ];

  const SPECIAL_CHIPS = [
    'No capsicum', 'Less spicy', 'No onion',
    'Extra sauce', 'Well done', 'No sugar',
  ];

  let selectedChips = [];
  let tableNum = null;

  // ══════════════════════════════════════════
  // INIT
  // ══════════════════════════════════════════
  document.addEventListener('DOMContentLoaded', () => {
    // Read table from URL
    const params = new URLSearchParams(window.location.search);
    tableNum = params.get('table');

    // Ambient track dots (pre-generate)
    renderTrackDots();

    // Load dynamic venue details from Supabase
    loadVenueDetails();
  });

  // ══════════════════════════════════════════
  // HELPERS
  // ══════════════════════════════════════════
  function calcOverall(s) {
    return s.food*0.3 + s.ambience*0.2 + s.service*0.2 + s.value*0.2 + s.wait*0.1;
  }

  function formatINR(n) {
    return '₹' + n.toLocaleString('en-IN');
  }

  function cartTotal() {
    return Object.values(cart).reduce((s, v) => s + v.item.price * v.qty, 0);
  }

  function cartCount() {
    return Object.values(cart).reduce((s, v) => s + v.qty, 0);
  }

  function showToast(msg) {
    const t = document.getElementById('vp-toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // ══════════════════════════════════════════
  // RENDER — Trust dimensions
  // ══════════════════════════════════════════
  function renderTrustDims() {
    const dims = [
      { label: 'Food',     key: 'food'     },
      { label: 'Ambience', key: 'ambience' },
      { label: 'Service',  key: 'service'  },
      { label: 'Value',    key: 'value'    },
      { label: 'Wait',     key: 'wait'     },
    ];
    const wrap = document.getElementById('trust-dims');
    wrap.innerHTML = dims.map(d => {
      const score = VENUE_DATA.scores[d.key];
      const pct   = (score / 10 * 100).toFixed(0);
      const isBad = score < 5.0;
      return `
      <div class="menu-trust-dim">
        <span class="menu-trust-dim-label">${d.label}</span>
        <div class="menu-trust-dim-track">
          <div class="menu-trust-dim-fill ${isBad ? 'menu-trust-dim-fill--bad' : ''}"
            style="width:0%" data-target="${pct}"></div>
        </div>
        <span class="menu-trust-dim-val">${score.toFixed(1)}</span>
      </div>`;
    }).join('');

    // Animate bars in
    setTimeout(() => {
      wrap.querySelectorAll('.menu-trust-dim-fill').forEach(bar => {
        bar.style.width = bar.dataset.target + '%';
      });
    }, 400);
  }

  // ══════════════════════════════════════════
  // RENDER — Category tabs
  // ══════════════════════════════════════════
  function renderCats() {
    const scroll = document.getElementById('menu-cats-scroll');
    scroll.innerHTML = VENUE_DATA.categories.map(cat => `
      <button class="menu-cat-btn ${cat === activeCategory ? 'active' : ''}"
        onclick="setCategory('${cat}')">${cat}</button>
    `).join('');
  }

  function setCategory(cat) {
    activeCategory = cat;
    renderCats();
    renderDishes();
  }

  // ══════════════════════════════════════════
  // RENDER — Dishes
  // ══════════════════════════════════════════
  function renderDishes() {
    const wrap = document.getElementById('menu-dishes');
    const filtered = activeCategory === 'Recommended'
      ? VENUE_DATA.menu
      : VENUE_DATA.menu.filter(d => d.category === activeCategory);

    if (filtered.length === 0) {
      wrap.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--muted)">No items in this category yet</div>`;
      return;
    }

    wrap.innerHTML = filtered.map((dish, i) => {
      const inCart = cart[dish.id];
      const qty    = inCart ? inCart.qty : 0;

      const tagClass = dish.tag === 'Popular'     ? 'dish-tag--popular'
                     : dish.tag === 'Veg'         ? 'dish-tag--veg'
                     : dish.tag === 'Bestseller'  ? 'dish-tag--bestseller'
                     : '';

      return `
      <div class="dish-card" id="dish-${dish.id}" style="animation-delay:${i * 0.06}s">
        <div class="dish-img-wrap">
          <img class="dish-img" src="${dish.img}" alt="${dish.name}" loading="lazy"
            onerror="this.parentElement.style.background='var(--hover)'">
          ${dish.tag ? `<span class="dish-tag ${tagClass}">${dish.tag}</span>` : ''}
        </div>
        <div class="dish-body">
          <div class="dish-name">${dish.name}</div>
          <div class="dish-desc">${dish.desc}</div>
          <div class="dish-foot">
            <div>
              <div class="dish-price">${formatINR(dish.price)}</div>
              <div class="dish-price-sub">incl. taxes</div>
            </div>
            ${qty === 0
              ? `<button class="dish-add-btn" onclick="addToCart('${dish.id}')" aria-label="Add ${dish.name}">+</button>`
              : `<div class="dish-qty-ctrl">
                   <button class="dish-qty-btn" onclick="changeQty('${dish.id}', -1)">−</button>
                   <span class="dish-qty-num">${qty}</span>
                   <button class="dish-qty-btn" onclick="changeQty('${dish.id}', 1)">+</button>
                 </div>`
            }
          </div>
        </div>
      </div>`;
    }).join('');

    // Trigger dish reveal animation
    requestAnimationFrame(() => {
      wrap.querySelectorAll('.dish-card').forEach(card => card.classList.add('visible'));
    });
  }

  // ══════════════════════════════════════════
  // CART LOGIC
  // ══════════════════════════════════════════
  function addToCart(id) {
    const dish = VENUE_DATA.menu.find(d => d.id === id);
    if (!dish) return;

    if (cart[id]) {
      cart[id].qty++;
    } else {
      cart[id] = { item: dish, qty: 1 };
    }

    updateOrderBar();
    renderDishes();
    showToast(`${dish.name} added`);
  }

  function changeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    updateOrderBar();
    renderDishes();
  }

  // Helper to sync cart with list buttons in the list when using cart screen controls
  function syncQty(id, qty) {
    // If we're synchronizing qty
  }

  function updateOrderBar() {
    const bar   = document.getElementById('menu-order-bar');
    const count = document.getElementById('order-count');
    const total = document.getElementById('order-total');
    const n = cartCount();

    if (n === 0) {
      bar.classList.add('hidden');
    } else {
      bar.classList.remove('hidden');
      count.textContent = n;
      total.textContent = formatINR(cartTotal());
    }
  }

  // ══════════════════════════════════════════
  // SCREEN NAVIGATION
  // ══════════════════════════════════════════
  function showScreen(id) {
    document.querySelectorAll('.vp-screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showCart() {
    renderCartBody();
    showScreen('screen-cart');
  }

  function showMenu() {
    showScreen('screen-menu');
  }

  // ══════════════════════════════════════════
  // RENDER — Cart body
  // ══════════════════════════════════════════
  function renderCartBody() {
    const body = document.getElementById('cart-body');
    const items = Object.values(cart);

    if (items.length === 0) {
      body.innerHTML = `
        <div class="cart-empty">
          <div class="cart-empty-icon">🛒</div>
          <div style="font-weight:700">Your cart is empty</div>
          <div style="font-size:13px">Add some items from the menu</div>
          <button class="cart-back-btn" onclick="showMenu()" style="margin-top:16px; width: auto; border-radius: 8px; padding: 8px 16px;">← Back to Menu</button>
        </div>`;
      document.getElementById('cart-confirm-bar').style.display = 'none';
      return;
    }

    document.getElementById('cart-confirm-bar').style.display = '';

    const subtotal = cartTotal();
    const gst      = subtotal * 0.05;
    const sc       = subtotal * 0.05;
    const total    = subtotal + gst + sc;

    body.innerHTML = `
      <!-- Cart items -->
      <div id="cart-items">
        ${items.map(({ item, qty }) => `
        <div class="cart-item" id="citem-${item.id}">
          <img class="cart-item-img" src="${item.img}" alt="${item.name}"
            onerror="this.style.background='var(--hover)'">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${formatINR(item.price)}</div>
            <div class="cart-item-ctrl">
              <button class="cart-item-ctrl-btn" onclick="cartChangeQty('${item.id}', -1)">−</button>
              <span class="cart-item-ctrl-num">${qty}</span>
              <button class="cart-item-ctrl-btn" onclick="cartChangeQty('${item.id}', 1)">+</button>
            </div>
          </div>
          <button class="cart-item-remove" onclick="cartRemove('${item.id}')" aria-label="Remove">✕</button>
        </div>`).join('')}
      </div>

      <!-- Special instructions -->
      <div class="cart-section-title">Special Instructions</div>
      <div class="cart-instruction-chips">
        ${SPECIAL_CHIPS.map(chip => `
        <button class="cart-chip ${selectedChips.includes(chip) ? 'active' : ''}"
          onclick="toggleChip('${chip}')">${chip}</button>`).join('')}
      </div>
      <input type="text" class="cart-custom-input" placeholder="Add custom instruction..."
        id="cart-custom-input">

      <!-- Order summary -->
      <div class="cart-summary">
        <div class="cart-section-title" style="margin-top:0">Order Summary</div>
        <div class="cart-summary-row">
          <span>Subtotal</span>
          <span>${formatINR(subtotal)}</span>
        </div>
        <div class="cart-summary-row">
          <span>GST (5%)</span>
          <span>${formatINR(Math.round(gst))}</span>
        </div>
        <div class="cart-summary-row">
          <span>Service Charge (5%)</span>
          <span>${formatINR(Math.round(sc))}</span>
        </div>
        <div class="cart-summary-divider"></div>
        <div class="cart-summary-total">
          <span>Estimated Total</span>
          <span>${formatINR(Math.round(total))}</span>
        </div>
      </div>

      <div class="cart-est-time">
        ⏱ Estimated serving time: 24 mins
        ${tableNum ? `· Table ${tableNum}` : ''}
      </div>
    `;
  }

  function cartChangeQty(id, delta) {
    if (!cart[id]) return;
    cart[id].qty += delta;
    if (cart[id].qty <= 0) delete cart[id];
    updateOrderBar();
    renderCartBody();
  }

  function cartRemove(id) {
    delete cart[id];
    updateOrderBar();
    renderCartBody();
  }

  function toggleChip(chip) {
    const idx = selectedChips.indexOf(chip);
    if (idx > -1) selectedChips.splice(idx, 1);
    else selectedChips.push(chip);
    // Re-render just chips
    document.querySelectorAll('.cart-chip').forEach(btn => {
      btn.classList.toggle('active', selectedChips.includes(btn.textContent));
    });
  }

  // ══════════════════════════════════════════
  // ORDER CONFIRMATION + TRACKING
  // ══════════════════════════════════════════
  async function confirmOrder() {
    const orderItems = Object.values(cart).map(({ item, qty }) => ({
      id:    item.id,
      name:  item.name,
      price: item.price,
      qty,
    }));

    const subtotal = cartTotal();
    const gst      = Math.round(subtotal * 0.05);
    const sc       = Math.round(subtotal * 0.05);
    const total    = subtotal + gst + sc;
    const instrEl  = document.getElementById('cart-custom-input');

    // Get venue ID from URL slug
    const slug = window.location.pathname.split('/').filter(Boolean)[0];

    try {
      const { data: venueRow } = await db
        .from('venues')
        .select('id')
        .eq('slug', slug)
        .eq('status', 'active')
        .single();

      if (venueRow?.id) {
        await db.from('orders').insert({
          venue_id:             venueRow.id,
          table_num:            null,
          items: orderItems,
          subtotal,
          gst,
          service_charge:       sc,
          total,
          special_instructions: instrEl?.value?.trim() || null,
          status:               'received',
          session_id:           snyfSessionId(),
          source:               'snyf',
        });

        // Log visit if not already logged this session
        if (!sessionStorage.getItem(`snyf_visit_${slug}`)) {
          await db.from('visits').insert({
            venue_id:   venueRow.id,
            session_id: snyfSessionId(),
            source:     new URLSearchParams(window.location.search).get('src') || 'direct',
            device:     window.innerWidth <= 768 ? 'mobile' : 'desktop',
            referrer:   document.referrer || null,
          });
          sessionStorage.setItem(`snyf_visit_${slug}`, '1');
        }
      }
    } catch (err) {
      dbError('confirmOrder', err);
      // Continue to tracking screen even if save fails
    }

    // Clear cart and show tracking (existing logic unchanged)
    cart = {};
    updateOrderBar();
    renderDishes();
    showScreen('screen-track');
    startTracking();
  }

  function startTracking() {
    trackState = 0;
    minsLeft   = 24;
    const statesEl   = document.getElementById('track-states');
    const progressEl = document.getElementById('track-progress');
    const minsEl     = document.getElementById('track-mins');
    const reviewEl   = document.getElementById('track-review');

    reviewEl.classList.remove('visible');

    // Render states
    statesEl.innerHTML = ORDER_STATES.map((s, i) => `
      <div class="track-state ${i === 0 ? 'state-active' : ''}" id="track-state-${i}">
        <div class="track-state-icon">${s.icon}</div>
        <span class="track-state-label">${s.label}</span>
      </div>`
    ).join('');

    progressEl.style.width = '0%';

    // Timer countdown
    if (trackTimeInterval) clearInterval(trackTimeInterval);
    trackTimeInterval = setInterval(() => {
      if (minsLeft > 0) {
        minsLeft--;
        minsEl.textContent = minsLeft;
      }
    }, 60000); // every real minute — for demo purposes advance faster

    // State progression — advance every 6 seconds for demo
    if (trackInterval) clearInterval(trackInterval);
    trackInterval = setInterval(() => {
      if (trackState < ORDER_STATES.length - 1) {
        // Mark current as done
        const curr = document.getElementById(`track-state-${trackState}`);
        if (curr) { curr.classList.remove('state-active'); curr.classList.add('state-done'); }

        trackState++;

        // Mark next as active
        const next = document.getElementById(`track-state-${trackState}`);
        if (next) next.classList.add('state-active');

        // Update progress bar
        const pct = (trackState / (ORDER_STATES.length - 1)) * 100;
        progressEl.style.width = pct + '%';

        // Show review when order received (first state done)
        if (trackState >= 1) {
          setTimeout(() => reviewEl.classList.add('visible'), 300);
        }
      } else {
        clearInterval(trackInterval);
      }
    }, 6000);
  }

  function updateSlider(dim, val) {
    const el = document.getElementById(`sl-${dim}-val`);
    if (el) el.textContent = parseFloat(val).toFixed(1);
  }

  function resetToMenu() {
    if (trackInterval)     clearInterval(trackInterval);
    if (trackTimeInterval) clearInterval(trackTimeInterval);
    cart = {};
    updateOrderBar();
    renderDishes();
    showScreen('screen-menu');
  }

  // ══════════════════════════════════════════
  // TRACKING SCREEN — Ambient dots
  // ══════════════════════════════════════════
  function renderTrackDots() {
    const wrap = document.getElementById('track-dots');
    const dots = Array.from({ length: 6 }, (_, i) => {
      const left = 20 + i * 14;
      const top  = 28 + (i % 2) * 38;
      const dur  = 3 + i;
      const delay = i * 0.6;
      return `<div class="track-dot" style="left:${left}%;top:${top}%;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
    }).join('');
    wrap.innerHTML = dots;
  }
  </script>
</body>
