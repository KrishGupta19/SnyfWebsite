  <style>
    /* ── Discover-specific styles only ── */

    /* Venue card — horizontal split layout */
    .dv-card {
      background: rgba(255,255,255,0.62);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 220px;
      backdrop-filter: blur(16px);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      animation: ch-card-in 0.4s ease both;
      position: relative;
    }

    .dv-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(30,30,27,0.1);
      border-color: rgba(111,183,214,0.35);
    }

    /* LEFT — image carousel */
    .dv-card-images {
      position: relative;
      overflow: hidden;
      background: var(--hover);
      min-height: 220px;
    }

    .dv-img-track {
      display: flex;
      height: 100%;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    }

    .dv-img {
      flex-shrink: 0;
      width: 280px;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Image placeholder fallback */
    .dv-img-placeholder {
      flex-shrink: 0;
      width: 280px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--display);
      font-size: 3rem;
      font-weight: 900;
      color: rgba(30,30,27,0.15);
      background: var(--hover);
    }

    /* Carousel nav buttons */
    .dv-img-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      background: rgba(246,245,242,0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--ink);
      cursor: pointer;
      z-index: 2;
      transition: all 0.18s;
      opacity: 0;
    }

    .dv-card-images:hover .dv-img-btn {
      opacity: 1;
    }

    .dv-img-btn:hover {
      background: var(--paper);
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .dv-img-btn--prev { left: 10px; }
    .dv-img-btn--next { right: 10px; }

    .dv-img-btn:disabled {
      opacity: 0.3 !important;
      cursor: default;
    }

    /* Image dots */
    .dv-img-dots {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      z-index: 2;
    }

    .dv-img-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(246,245,242,0.5);
      transition: all 0.2s;
      cursor: pointer;
    }

    .dv-img-dot.active {
      background: #F6F5F2;
      width: 14px;
      border-radius: 3px;
    }

    /* Image counter badge */
    .dv-img-counter {
      position: absolute;
      top: 10px;
      right: 10px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      color: rgba(246,245,242,0.9);
      background: rgba(30,30,27,0.5);
      backdrop-filter: blur(6px);
      padding: 3px 8px;
      border-radius: 4px;
      z-index: 2;
    }

    /* Verified partner badge on image */
    .dv-partner-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mint);
      background: rgba(30,30,27,0.65);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(123,198,164,0.4);
      padding: 3px 9px;
      border-radius: 4px;
      z-index: 2;
    }

    /* RIGHT — venue info */
    .dv-card-info {
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dv-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .dv-venue-name {
      font-size: 19px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.2;
      margin-bottom: 5px;
    }

    .dv-venue-meta {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .dv-zone-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--hover);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .dv-cat-tag {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cyan);
      background: rgba(111,183,214,0.1);
      border: 1px solid rgba(111,183,214,0.2);
      padding: 2px 8px;
      border-radius: 4px;
    }


    /* Tagline — shown prominently below venue name + zone */
    .dv-venue-tagline {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    /* Description */
    .dv-venue-desc {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.65;
      flex: 1;
    }

    /* Vibe tags */
    .dv-vibes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .dv-vibe {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      background: var(--hover);
      border-radius: 20px;
      padding: 4px 10px;
    }


    /* Card footer */
    .dv-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(30,30,27,0.06);
      flex-wrap: wrap;
    }

    .dv-hours {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dv-hours-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--mint);
      flex-shrink: 0;
    }

    .dv-hours-dot--closed {
      background: var(--orange);
    }

    /* Know More button */
    .dv-know-more {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--ink);
      color: #F6F5F2;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }

    .dv-know-more:hover {
      background: #2d2d29;
      transform: translateY(-1px);
    }

    .dv-know-more-arrow {
      transition: transform 0.18s;
      font-size: 14px;
    }

    .dv-know-more:hover .dv-know-more-arrow {
      transform: translateX(3px);
    }

    /* Venue cards grid — single column (cards are wide) */
    .dv-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Hero specific overrides */
    .dv-hero-stat strong { color: var(--ink); font-weight: 700; }

    /* Touch swipe support indicator */
    .dv-swipe-hint {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      color: rgba(246,245,242,0.5);
      display: none;
      white-space: nowrap;
      z-index: 2;
    }

    @media (hover: none) {
      .dv-swipe-hint { display: block; }
      .dv-img-btn { opacity: 1 !important; }
    }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .dv-card {
        grid-template-columns: 1fr;
        min-height: unset;
      }
      .dv-card-images {
        height: 220px;
        min-height: 220px;
      }
      .dv-img { width: 100%; }
      .dv-img-track { width: 100%; }
      .dv-dims { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .dv-card-info { padding: 18px; }
      .dv-venue-name { font-size: 16px; }
      .dv-card-foot { flex-direction: column; align-items: flex-start; }
      .dv-know-more { width: 100%; justify-content: center; }
    }
  </style>
</head>

  <script>
  // ── VENUE DATA ────────────────────────────────────────────────
  let VENUES = [];

async function loadVenues() {
  try {
    const { data, error } = await db
      .from('venues')
      .select(`
        id, slug, name, zone, category,
        description, tagline,
        featured, sort_order, hours,
        venue_photos ( url, sort_order, alt_text )
      `)
      .eq('status', 'active')
      .order('sort_order', { ascending: true });

    if (error) throw error;

    VENUES = (data || []).map(v => ({
      slug:     v.slug,
      name:     v.name,
      zone:     v.zone     || '',
      category: v.category || '',
      desc:     v.description || '',
      tagline:  v.tagline  || '',
      isOpen:   true,
      hours:    v.hours    || 'Check venue for hours',
      vibes:    [],
      scores:   { food: 5.0, ambience: 5.0, service: 5.0, value: 5.0, wait: 5.0 },
      images:   (v.venue_photos || [])
                  .sort((a, b) => a.sort_order - b.sort_order)
                  .map(p => p.url)
                  .filter(Boolean),
      page:     `${v.slug}`,
      featured: v.featured || false,
      id:       v.id,
    }));

    try {
      const { data: reports, error: reportsErr } = await db
        .from('field_reports')
        .select('venue_id, food, ambience, service, value, wait_time')
        .eq('verified', true)
        .eq('flagged', false);

      if (!reportsErr && reports) {
        VENUES.forEach(v => {
          const vReports = reports.filter(r => r.venue_id === v.id);
          if (vReports.length > 0) {
            const sums = vReports.reduce((acc, curr) => ({
              food: acc.food + (curr.food || 5),
              ambience: acc.ambience + (curr.ambience || 5),
              service: acc.service + (curr.service || 5),
              value: acc.value + (curr.value || 5),
              wait: acc.wait + (curr.wait_time || 5)
            }), { food: 0, ambience: 0, service: 0, value: 0, wait: 0 });

            v.scores = {
              food: sums.food / vReports.length,
              ambience: sums.ambience / vReports.length,
              service: sums.service / vReports.length,
              value: sums.value / vReports.length,
              wait: sums.wait / vReports.length
            };
          }
        });
      }
    } catch (e) {
      console.warn('Failed to load trust scores from field reports:', e);
    }

    // Update hero stat counters
    const statEl = document.getElementById('stat-venues');
    const verEl  = document.getElementById('stat-verified-venues');
    if (statEl) statEl.textContent = VENUES.length;
    if (verEl)  verEl.textContent  = VENUES.length;

    renderGrid();

  } catch (err) {
    dbError('loadVenues', err);
    dbFallback('dv-grid', 'Could not load venues. Check your connection.');
  }
}

  // ── STATE ─────────────────────────────────────────────────────
  let activeCategory = 'all';
  let activeZone     = 'all';
  let activeSort     = 'newest';
  let searchQuery    = '';

  // Per-card carousel state
  const carouselState = {};

  // ── FILTER + SORT ─────────────────────────────────────────────
  function getFiltered() {
    return VENUES
      .filter(v => {
        if (activeCategory !== 'all' && v.category !== activeCategory) return false;
        if (activeZone !== 'all' && v.zone !== activeZone) return false;
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          return v.name.toLowerCase().includes(q) ||
                 v.zone.toLowerCase().includes(q) ||
                 v.desc.toLowerCase().includes(q) ||
                 v.vibes.some(vb => vb.toLowerCase().includes(q));
        }
        return true;
      })
      .sort((a, b) => {
        if (activeSort === 'score')  return overallScore(b) - overallScore(a);
        if (activeSort === 'name')   return a.name.localeCompare(b.name);
        if (activeSort === 'newest') return VENUES.indexOf(b) - VENUES.indexOf(a);
        return 0;
      });
  }

  function overallScore(v) {
    const s = v.scores;
    return s.food*0.3 + s.ambience*0.2 + s.service*0.2 + s.value*0.2 + s.wait*0.1;
  }

  // ── RENDER CARD ─────────────────────────────────────────────
  function renderCard(venue, idx) {
    const imgCount = venue.images.length;
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port !== '';
    const targetUrl = isLocal ? `/venue.html?slug=${venue.slug}` : `/${venue.slug}`;

    return `
    <div class="dv-card" data-idx="${idx}" data-slug="${venue.slug}">

      <!-- LEFT — image carousel -->
      <div class="dv-card-images" id="imgs-${venue.slug}">
        <div class="dv-img-track" id="track-${venue.slug}">
          ${venue.images.length > 0 ? venue.images.map((src, i) => `
            <img
              class="dv-img"
              src="${src}"
              alt="${venue.name} — photo ${i+1}"
              loading="${i === 0 ? 'eager' : 'lazy'}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
            >
            <div class="dv-img-placeholder" style="display:none">${venue.name[0]}</div>
          `).join('') : `<div class="dv-img-placeholder">${venue.name[0]}</div>`}
        </div>

        <!-- Prev/Next buttons -->
        <button class="dv-img-btn dv-img-btn--prev" id="prev-${venue.slug}" onclick="carouselMove('${venue.slug}', -1)" aria-label="Previous image" ${imgCount <= 1 ? 'disabled' : ''}>‹</button>
        <button class="dv-img-btn dv-img-btn--next" id="next-${venue.slug}" onclick="carouselMove('${venue.slug}', 1)" aria-label="Next image" ${imgCount <= 1 ? 'disabled' : ''}>›</button>

        <!-- Dots -->
        <div class="dv-img-dots" id="dots-${venue.slug}">
          ${venue.images.map((_, i) => `
            <div class="dv-img-dot ${i === 0 ? 'active' : ''}" onclick="carouselGoTo('${venue.slug}', ${i})"></div>
          `).join('')}
        </div>

        <!-- Counter -->
        <div class="dv-img-counter" id="counter-${venue.slug}">1 / ${imgCount || 1}</div>

        <!-- Partner badge -->
        <div class="dv-partner-badge">✓ Snyf Partner</div>

        <!-- Swipe hint on touch -->
        <div class="dv-swipe-hint">swipe for more</div>
      </div>

      <!-- RIGHT — info -->
      <div class="dv-card-info">

        <div class="dv-card-top">
          <div>
            <div class="dv-venue-name">${venue.name}</div>
            <div class="dv-venue-meta">
              <span class="dv-zone-tag">${venue.zone}</span>
              <span class="dv-cat-tag">${venue.category}</span>
            </div>
          </div>
        </div>

        ${venue.tagline ? `<p class="dv-venue-tagline">${venue.tagline}</p>` : ''}
        ${venue.desc ? `<p class="dv-venue-desc">${venue.desc}</p>` : ''}

        <div class="dv-vibes">
          ${venue.vibes.map(v => `<span class="dv-vibe">${v}</span>`).join('')}
        </div>

        <div class="dv-card-foot">
          <div class="dv-hours">
            <span class="dv-hours-dot ${venue.isOpen ? '' : 'dv-hours-dot--closed'}"></span>
            ${venue.hours}
          </div>
          <a href="${targetUrl}" class="dv-know-more" target="_blank" rel="noopener">
            Know More
            <span class="dv-know-more-arrow">→</span>
          </a>
        </div>

      </div>
    </div>`;
  }

  // ── RENDER GRID ───────────────────────────────────────────────
  function renderGrid() {
    const venues = getFiltered();
    const grid = document.getElementById('dv-grid');
    const countEl = document.getElementById('dv-count');

    if (!grid) return;

    countEl.textContent = `Showing ${venues.length} venue${venues.length !== 1 ? 's' : ''}`;

    if (venues.length === 0) {
      grid.innerHTML = `
        <div style="text-align:center;padding:60px 20px;color:var(--muted)">
          <div style="font-size:2rem;margin-bottom:12px">◈</div>
          <div style="font-weight:700;margin-bottom:6px">No venues found</div>
          <div style="font-size:13px">Try a different filter or search term</div>
        </div>`;
      return;
    }

    grid.innerHTML = venues.map((v, i) => renderCard(v, i)).join('');

    // Initialise carousel state for each card
    venues.forEach(v => {
      carouselState[v.slug] = { current: 0 };
      initTouchSwipe(v.slug, v.images.length);
    });

    // Animate dimension bars in after short delay
    setTimeout(() => {
      document.querySelectorAll('.dv-dim-fill').forEach(bar => {
        bar.style.transition = 'width 0.9s cubic-bezier(0.22,1,0.36,1)';
        bar.style.width = bar.dataset.target + '%';
      });
    }, 100);
  }

  // ── CAROUSEL LOGIC ────────────────────────────────────────────
  function carouselMove(slug, dir) {
    const venue = VENUES.find(v => v.slug === slug);
    if (!venue) return;

    const state = carouselState[slug] || { current: 0 };
    const total = venue.images.length;
    state.current = Math.max(0, Math.min(total - 1, state.current + dir));
    carouselState[slug] = state;
    updateCarousel(slug, state.current, total);
  }

  function carouselGoTo(slug, idx) {
    const venue = VENUES.find(v => v.slug === slug);
    if (!venue) return;
    const total = venue.images.length;
    carouselState[slug] = { current: idx };
    updateCarousel(slug, idx, total);
  }

  function updateCarousel(slug, current, total) {
    const track   = document.getElementById(`track-${slug}`);
    const dots    = document.getElementById(`dots-${slug}`);
    const counter = document.getElementById(`counter-${slug}`);
    const prevBtn = document.getElementById(`prev-${slug}`);
    const nextBtn = document.getElementById(`next-${slug}`);

    if (!track) return;

    // Get the actual rendered width of one image
    const imgEl = track.querySelector('.dv-img');
    const imgWidth = imgEl ? imgEl.offsetWidth : 280;

    track.style.transform = `translateX(-${current * imgWidth}px)`;

    // Update dots
    if (dots) {
      dots.querySelectorAll('.dv-img-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === current);
      });
    }

    // Update counter
    if (counter) counter.textContent = `${current + 1} / ${total}`;

    // Update button disabled state
    if (prevBtn) prevBtn.disabled = current === 0;
    if (nextBtn) nextBtn.disabled = current === total - 1;
  }

  // Touch swipe support
  function initTouchSwipe(slug, total) {
    const imgWrap = document.getElementById(`imgs-${slug}`);
    if (!imgWrap) return;

    let touchStartX = 0;
    let touchStartY = 0;
    let isDragging  = false;

    imgWrap.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      isDragging  = true;
    }, { passive: true });

    imgWrap.addEventListener('touchend', e => {
      if (!isDragging) return;
      isDragging = false;

      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      // Only trigger if horizontal swipe dominates
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
        carouselMove(slug, dx < 0 ? 1 : -1);
      }
    }, { passive: true });
  }

  // ── TICKER ────────────────────────────────────────────────────
  function initTicker() {
    const ticker = document.getElementById('dv-ticker');
    if (!ticker) return;

    // Static ticker — update manually or connect to ticker_events table later
    const events = [
      { text: '✓ Snyf partner venues — NCR · Gurugram',   type: 'ok'  },
      { text: '◈ New venue onboarding underway',           type: 'new' },
      { text: '✓ Trust intelligence layer — active',       type: 'ok'  },
      { text: '◈ Field reports — community powered',       type: 'new' },
      { text: '✓ QR scanning active at partner venues',    type: 'ok'  },
    ];

    const doubled = [...events, ...events];
    ticker.innerHTML = doubled.map(e =>
      `<span class="ch-tick-item ch-tick--${e.type}">${e.text}</span>
       <span class="ch-tick-sep">·</span>`
    ).join('');
  }

  // ── FILTER BINDINGS ───────────────────────────────────────────
  document.querySelectorAll('#dv-cat-filters .ch-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#dv-cat-filters .ch-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.cat;
      renderGrid();
    });
  });

  document.querySelectorAll('#dv-zone-filters .ch-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#dv-zone-filters .ch-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeZone = btn.dataset.zone;
      renderGrid();
    });
  });

  document.getElementById('dv-sort')?.addEventListener('change', e => {
    activeSort = e.target.value;
    renderGrid();
  });

  document.getElementById('dv-search')?.addEventListener('input', e => {
    searchQuery = e.target.value.trim();
    renderGrid();
  });

  // ── NAVBAR SCROLL ─────────────────────────────────────────────
  window.addEventListener('scroll', () => {
    document.querySelector('.ch-nav')?.classList.toggle('scrolled', window.scrollY > 10);
  }, { passive: true });

  // ── INIT ──────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    sessionStorage.setItem('snyf_visited', 'true');
    initTicker();
    loadVenues();

    // ── Custom Cybernetic Cursor Tracking ───────────────────────────
    (function () {
      const isFinePointer = window.matchMedia('(pointer: fine)').matches;
      if (!isFinePointer) return;

      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');
      if (!dot || !ring) return;

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      
      let ringX = mouseX;
      let ringY = mouseY;
      let dotX = mouseX;
      let dotY = mouseY;

      window.addEventListener('mousemove', e => {
        mouseX = e.clientX;
        mouseY = e.clientY;
      }, { passive: true });

      document.addEventListener('mouseleave', () => {
        dot.style.opacity = '0';
        ring.style.opacity = '0';
      });
      document.addEventListener('mouseenter', () => {
        dot.style.opacity = '1';
        ring.style.opacity = '1';
      });

      function updateCursor() {
        // Instant dot lock for zero lag feel
        dotX += (mouseX - dotX);
        dotY += (mouseY - dotY);
        dot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0)`;

        // Spring damped trailing ring
        ringX += (mouseX - ringX) * 0.15;
        ringY += (mouseY - ringY) * 0.15;
        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;

        requestAnimationFrame(updateCursor);
      }
      requestAnimationFrame(updateCursor);

      // Hover effect for interactive elements
      const hoverTargets = 'a, button, input, select, textarea, [role="button"], .ch-card, .ch-pill, .ch-react, .quick-place, .dv-card, .dv-know-more, .dv-img-btn, .dv-img-dot';
      
      document.addEventListener('mouseover', e => {
        if (e.target && e.target.closest(hoverTargets)) {
          document.body.classList.add('cursor-hovering');
        }
      }, { passive: true });

      document.addEventListener('mouseout', e => {
        if (e.target && !e.target.closest(hoverTargets)) {
          document.body.classList.remove('cursor-hovering');
        }
      }, { passive: true });
    })();
  });

  // Recalculate carousel widths on resize (images may resize)
  window.addEventListener('resize', () => {
    Object.keys(carouselState).forEach(slug => {
      const venue = VENUES.find(v => v.slug === slug);
      if (!venue) return;
      const state = carouselState[slug];
      updateCarousel(slug, state.current, venue.images.length);
    });
  }, { passive: true });
  </script>
</body>
</html>
