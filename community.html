      background: rgba(111,183,214,0.08);

  <div id="browse-page">
    <!-- ZONE 2 — New Hero -->
    <section class="ch-hero">
      <div class="ch-container">
        <div class="ch-hero-inner">


          <h1 class="ch-heading">
            The Commons<span class="ch-dot">.</span>
          </h1>

          <p class="ch-sub">
            Verified field reports from people who actually showed up.
            No star ratings. No fake consensus.
          </p>

          <div class="ch-hero-actions">
            <button class="ch-btn ch-btn--primary" id="hero-write-btn">
              + Write a Field Report
            </button>
            <div class="ch-hero-stats">
              <span><strong id="stat-total">847</strong> reports</span>
              <span class="ch-stat-sep">·</span>
              <span><strong id="stat-verified">312</strong> verified</span>
              <span class="ch-stat-sep">·</span>
              <span><strong id="stat-average">94%</strong> confidence avg</span>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ZONE 3 — Feed With Floating Filter Pill -->
    <section class="ch-feed-section">
      <div class="ch-container">
        <div class="ch-filter-bar" id="ch-filter-bar">
          <div class="ch-filter-container">

            <!-- Top Row: Search and Sort -->
            <div class="ch-filter-row ch-filter-row--top">
              <div class="ch-search-wrap">
                <span class="ch-search-icon">⌕</span>
                <input
                  type="search"
                  class="ch-search"
                  id="search-input"
                  placeholder="Search cafés, zones..."
                  autocomplete="off"
                >
              </div>

              <select class="ch-sort" id="sort-select">
                <option value="recent">Recent</option>
                <option value="score">Top Score</option>
                <option value="helpful">Most Helpful</option>
              </select>
            </div>

            <!-- Middle Row: Zones (All NCR...) -->
            <div class="ch-filter-scroll-wrapper">
              <div class="ch-pills" id="zone-filters">
                <button class="ch-pill ch-pill--zone active" data-zone="all">All NCR</button>
                <button class="ch-pill ch-pill--zone" data-zone="Cyber Hub">Cyber Hub</button>
                <button class="ch-pill ch-pill--zone" data-zone="Sector 29">Sector 29</button>
                <button class="ch-pill ch-pill--zone" data-zone="DLF Phase 4">DLF Phase 4</button>
                <button class="ch-pill ch-pill--zone" data-zone="Khan Market">Khan Market</button>
                <button class="ch-pill ch-pill--zone" data-zone="Sushant Lok">Sushant Lok</button>
              </div>
            </div>

            <!-- Bottom Row: Filter (All, Verified, Flagged...) -->
            <div class="ch-filter-scroll-wrapper">
              <div class="ch-pills" id="status-filters">
                <button class="ch-pill active" data-filter="all">All</button>
                <button class="ch-pill" data-filter="verified">✓ Verified</button>
                <button class="ch-pill" data-filter="flagged">⚠ Flagged</button>
              </div>
            </div>

          </div>
        </div>

        <!-- Feed count and meta -->
        <div class="ch-feed-meta">
          <span class="ch-feed-count" id="feed-count">Showing 20 reports</span>
          <span class="ch-feed-live">
            <span class="ch-pulse ch-pulse--small"></span>
            Live
          </span>
        </div>

        <!-- Cards feed — full width, 2-col on large screens -->
        <div class="ch-cards" id="feed-list">
          <!-- Injected by JS renderFeed() -->
        </div>

        <button class="ch-load-more" id="load-more">Load More Reports</button>
      </div>
    </section>

  <!-- Form Page / Write Report Modal overlay container -->
  <section class="form-page" id="form-page">
    <div class="form-shell">
      <div class="form-card">
        <div class="form-actions" style="margin-top:0;margin-bottom:24px;">
          <div>
            <div class="eyebrow">Submit Report</div>
            <h2 style="font-size:clamp(2rem,6vw,4rem);line-height:.95;margin:0;font-family:Oswald,Impact,sans-serif;text-transform:uppercase;">Field Report</h2>
          </div>
          <button class="ch-btn" id="back-to-community" type="button">Back to Commons</button>
        </div>

        <div class="step-row" aria-hidden="true">
          <div class="step-pill active" data-step-pill="1"></div>
          <div class="step-pill" data-step-pill="2"></div>
          <div class="step-pill" data-step-pill="3"></div>
          <div class="step-pill" data-step-pill="4"></div>
        </div>

        <div class="form-step active" data-step="1">
          <div class="field" style="position:relative; width:100%;">
            <label for="place-input">Place visited</label>
            <input id="place-input" type="text" placeholder="Type a cafe or restaurant name" autocomplete="off">
            <div id="autocomplete-list" class="wr-autocomplete-list" style="display:none;"></div>
          </div>
          <div class="quick-places" id="quick-places">
            <!-- Loaded dynamically from Supabase -->
          </div>
          <div class="form-actions">
            <span></span>
            <button class="ch-btn ch-btn--primary" id="step-1-next" type="button" disabled>Continue</button>
          </div>
        </div>

        <div class="form-step" data-step="2">
          <div id="sliders"></div>
          <div class="live-row" style="background:var(--ink);border-radius:14px;border:0;padding:16px;margin-top:18px;display:flex;justify-content:space-between;color:white;font-family:var(--mono);">
            <span>Composite trust score</span>
            <strong><span id="composite-score">5.0</span>/7</strong>
          </div>
          <div class="form-actions">
            <button class="ch-btn back-step" type="button" data-back="1">Back</button>
            <button class="ch-btn ch-btn--primary" id="step-2-next" type="button">Continue</button>
          </div>
        </div>

        <div class="form-step" data-step="3">
          <div class="field">
            <label for="note-input">One honest observation</label>
            <textarea id="note-input" maxlength="180" rows="5" placeholder="What should the community know?"></textarea>
          </div>
          <div class="feed-head" style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px;">
            <span></span>
            <span><span id="char-count">0</span>/180</span>
          </div>
          <div class="form-actions">
            <button class="ch-btn back-step" type="button" data-back="2">Back</button>
            <button class="ch-btn ch-btn--primary" id="step-3-next" type="button">Continue</button>
          </div>
        </div>

        <div class="form-step" data-step="4">
          <div id="auth-fields-wrapper">
            <div class="field">
              <label for="handle-input">Name or handle</label>
              <input id="handle-input" type="text" placeholder="@your_handle" autocomplete="off">
            </div>
            <div class="field">
              <label for="email-input">Email for verification</label>
              <input id="email-input" type="email" placeholder="you@example.com" autocomplete="email">
            </div>
          </div>
          <label style="display:flex;align-items:center;gap:10px;margin-top:12px;cursor:pointer;">
            <input id="visited-input" type="checkbox" style="width:18px;height:18px;accent-color:var(--cyan);">
            <span>I personally visited this place</span>
          </label>
          <div class="form-actions">
            <button class="ch-btn back-step" type="button" data-back="3">Back</button>
            <button class="ch-btn ch-btn--primary" id="submit-btn" type="button" disabled>Submit Report</button>
          </div>
        </div>

        <div class="form-step" data-step="success">
          <div class="success-box" id="success-box" style="background:rgba(30,30,27,0.9);color:white;border-radius:16px;padding:26px;line-height:1.8;font-family:var(--mono);font-size:13px;border:1px solid rgba(255,255,255,0.12);"></div>
          <div class="form-actions">
            <button class="ch-btn" id="success-back-btn" type="button">Back to Commons</button>
            <button class="ch-btn ch-btn--primary" id="new-report-btn" type="button">Write Another</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- JS LOGIC AND DATA -->
  <script>
    const TRUST_LEVELS = {
      anchor: { label: 'Anchor', icon: '⚓', color: '#7BC6A4' },
      trusted: { label: 'Trusted', icon: '✓', color: '#6FB7D6' },
      standard: { label: 'Standard', icon: '⏱', color: '#D4A853' }
    };

    const reports = [];


    const dimensions = [
      { key: 'food', label: 'Food' },
      { key: 'ambience', label: 'Ambience' },
      { key: 'service', label: 'Service' },
      { key: 'value', label: 'Value' },
      { key: 'wait', label: 'Wait Time' },
    ];

    const state = {
      filter: 'all',
      zone: 'all',
      sort: 'recent',
      search: '',
      form: { place: '', scores: { food: 5, ambience: 5, service: 5, value: 5, wait: 5 } },
    };

    let activeVenues = [];
    let selectedVenueId = null;

    const $ = selector => document.querySelector(selector);
    const $$ = selector => Array.from(document.querySelectorAll(selector));


    function renderReport(r) {
      const tl = TRUST_LEVELS[r.trustLevel] || TRUST_LEVELS.standard;
      const overall = ((r.scores.food*0.3)+(r.scores.ambience*0.2)+(r.scores.service*0.2)+(r.scores.value*0.2)+(r.scores.wait*0.1)).toFixed(1);
      const isLow = parseFloat(overall) < 3.85;
      const scoreColor = isLow ? '#D97A4A' : parseFloat(overall) >= 5.6 ? '#7BC6A4' : '#6FB7D6';

      return `
      <article class="ch-card ${r.flagged ? 'ch-card--flagged' : ''}" data-id="${r.id}"
        data-zone="${r.zone}" data-verified="${r.verified}"
        data-flagged="${r.flagged}" data-days="${r.daysAgo}"
        data-score="${overall}" data-helpful="${r.reactions.helpful}">

        ${r.flagged ? `<div class="ch-card-flag">⚠ Anomaly detected — pattern flagged for review</div>` : ''}

        <!-- Card header row -->
        <div class="ch-card-head">
          <div class="ch-card-place">
            <div class="ch-card-name">${r.cafe}</div>
            <div class="ch-card-zone">${r.zone}</div>
          </div>
          <div class="ch-card-score-wrap">
            <div class="ch-card-score" style="color:${scoreColor}">${overall}</div>
            <div class="ch-card-score-label">/7</div>
          </div>
        </div>

        <!-- 5 dimension bars — compact horizontal -->
        <div class="ch-dims">
          ${renderDimBar('Food', r.scores.food)}
          ${renderDimBar('Ambience', r.scores.ambience)}
          ${renderDimBar('Service', r.scores.service)}
          ${renderDimBar('Value', r.scores.value)}
          ${renderDimBar('Wait', r.scores.wait)}
        </div>

        <!-- Note -->
        ${r.note ? `<p class="ch-card-note">"${r.note}"</p>` : ''}

        <!-- Footer -->
        <div class="ch-card-foot">
          <div class="ch-card-reviewer">
            <span class="ch-trust-badge" style="color:${tl.color};border-color:${tl.color}40">
              ${tl.icon} ${tl.label}
            </span>
            <span class="ch-handle">${r.reviewer}</span>
            <span class="ch-time">${r.time}</span>
            ${r.verified ? '<span class="ch-verified-tick">✓ verified</span>' : ''}
          </div>
          <div class="ch-reactions">
            <button class="ch-react" data-reaction="accurate" data-id="${r.id}">
              ✓ <span>${r.reactions.accurate}</span>
            </button>
            <button class="ch-react" data-reaction="outdated" data-id="${r.id}">
              ⏱ <span>${r.reactions.outdated}</span>
            </button>
            <button class="ch-react" data-reaction="helpful" data-id="${r.id}">
              💡 <span>${r.reactions.helpful}</span>
            </button>
          </div>
        </div>

      </article>`;
    }

    function renderDimBar(label, score) {
      const isFlagged = score < 3.5;
      const pct = (score / 7 * 100).toFixed(0);
      return `
      <div class="ch-dim">
        <span class="ch-dim-label">${label}</span>
        <div class="ch-dim-track">
          <div class="ch-dim-fill ${isFlagged ? 'ch-dim-fill--bad' : ''}" style="width:${pct}%"></div>
        </div>
        <span class="ch-dim-val ${isFlagged ? 'ch-dim-val--bad' : ''}">${score.toFixed(1)}</span>
      </div>`;
    }

    function animateScoreBars() {
      document.querySelectorAll('.ch-dim-fill').forEach(bar => {
        const target = bar.style.width;
        bar.style.width = '0%';
        requestAnimationFrame(() => {
          setTimeout(() => { bar.style.width = target; }, 60);
        });
      });
    }

    function filteredReports() {
      const query = state.search.toLowerCase();
      return reports
        .filter(report => state.filter === 'all' || (state.filter === 'verified' && report.verified) || (state.filter === 'flagged' && report.flagged))
        .filter(report => state.zone === 'all' || report.zone === state.zone)
        .filter(report => !query || report.cafe.toLowerCase().includes(query) || report.zone.toLowerCase().includes(query) || report.note.toLowerCase().includes(query))
        .sort((a, b) => {
          const overallA = ((a.scores.food*0.3)+(a.scores.ambience*0.2)+(a.scores.service*0.2)+(a.scores.value*0.2)+(a.scores.wait*0.1));
          const overallB = ((b.scores.food*0.3)+(b.scores.ambience*0.2)+(b.scores.service*0.2)+(b.scores.value*0.2)+(b.scores.wait*0.1));
          if (state.sort === 'score') return overallB - overallA;
          if (state.sort === 'helpful') return b.reactions.helpful - a.reactions.helpful;
          return a.id - b.id;
        });
    }

    function renderReports() {
      const list = $('#feed-list');
      const data = filteredReports();
      $('#feed-count').textContent = `Showing ${data.length} report${data.length === 1 ? '' : 's'}`;
      list.innerHTML = data.length ? data.map(report => renderReport(report)).join('') : '<div class="panel empty">No reports match this view.</div>';
      
      animateScoreBars();

      $$('.ch-card').forEach((card, index) => {
        card.style.animationDelay = `${Math.min(index * 0.055, 0.35)}s`;
      });
    }

    function renderStats() {
      const verified = reports.filter(report => report.verified).length;
      // Calculate avg confidence based on overall score avg
      const confidenceSum = reports.reduce((sum, r) => {
        const overall = ((r.scores.food*0.3)+(r.scores.ambience*0.2)+(r.scores.service*0.2)+(r.scores.value*0.2)+(r.scores.wait*0.1));
        return sum + overall;
      }, 0);
      const average = confidenceSum / reports.length;
      
      $('#stat-total').textContent = reports.length;
      $('#stat-verified').textContent = verified;
      $('#stat-average').textContent = (average / 7 * 100).toFixed(0) + '%';
    }

    function showBrowse() {
      $('#browse-page').style.display = 'block';
      $('#form-page').classList.remove('active');
      history.replaceState(null, '', 'community.html');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showForm() {
      $('#browse-page').style.display = 'none';
      $('#form-page').classList.add('active');
      history.replaceState(null, '', 'community.html#write');
      goStep(1);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goStep(step) {
      $$('.form-step').forEach(panel => panel.classList.toggle('active', panel.dataset.step === String(step)));
      $$('[data-step-pill]').forEach(pill => pill.classList.toggle('active', Number(pill.dataset.stepPill) <= Number(step)));
    }

    function renderSliders() {
      $('#sliders').innerHTML = dimensions.map(dim => `
        <div class="slider-row">
          <strong>${dim.label}</strong>
          <input type="range" min="1" max="7" step="0.1" value="${state.form.scores[dim.key]}" data-score="${dim.key}">
          <span class="slider-value" id="value-${dim.key}">${state.form.scores[dim.key].toFixed(1)}</span>
        </div>
      `).join('');
    }

    function updateComposite() {
      const s = state.form.scores;
      const score = ((s.food * 0.3) + (s.ambience * 0.2) + (s.service * 0.2) + (s.value * 0.2) + (s.wait * 0.1)).toFixed(1);
      $('#composite-score').textContent = score;
      return score;
    }

    function setPlace(place, venueId = null) {
      state.form.place = place.trim();
      selectedVenueId = venueId;
      $('#place-input').value = state.form.place;
      validatePlace();
      
      // Close autocomplete
      $('#autocomplete-list').innerHTML = '';
      $('#autocomplete-list').style.display = 'none';
    }

    function validatePlace() {
      state.form.place = $('#place-input').value.trim();
      $('#step-1-next').disabled = !state.form.place;
    }

    function validateSubmit() {
      const handle = $('#handle-input').value.trim();
      const email = $('#email-input').value.trim();
      const visited = $('#visited-input').checked;
      $('#submit-btn').disabled = !(handle && email && visited);
    }

    async function checkCurrentUser() {
      try {
        const user = await snyfGetUser();
        const wrapper = document.getElementById('auth-fields-wrapper');
        if (user) {
          const profile = await snyfGetProfile(user.id);
          const handle = profile?.handle || '';
          const name = profile?.name || user.user_metadata?.name || '';
          const fallback = user.email ? user.email.split('@')[0] : 'scout';
          
          $('#handle-input').value = handle ? `@${handle}` : (name ? name : `@${fallback}`);
          $('#email-input').value = user.email || '';
          
          if (wrapper) {
            wrapper.style.display = 'none';
          }
        } else {
          if (wrapper) {
            wrapper.style.display = 'block';
          }
        }
        validateSubmit();
      } catch (err) {
        console.error('Error checking user session:', err);
      }
    }

    function resetForm() {
      state.form = { place: '', scores: { food: 5, ambience: 5, service: 5, value: 5, wait: 5 } };
      selectedVenueId = null;
      $('#place-input').value = '';
      $('#note-input').value = '';
      $('#char-count').textContent = '0';
      $('#handle-input').value = '';
      $('#email-input').value = '';
      $('#visited-input').checked = false;
      $$('.quick-place').forEach(button => button.classList.remove('active'));
      renderSliders();
      updateComposite();
      validatePlace();
      
      checkCurrentUser();
      
      goStep(1);
    }

    async function loadReportsFromDB() {
      try {
        const { data, error } = await db
          .from('field_reports')
          .select('*')
          .not('user_id', 'is', null)
          .order('created_at', { ascending: false })
          .limit(60);

        if (error) throw error;

        const dbReports = (data || []).map(r => {
          const overall = (
            ((r.food||5)*0.3) + ((r.ambience||5)*0.2) +
            ((r.service||5)*0.2) + ((r.value||5)*0.2) + ((r.wait_time||5)*0.1)
          );
          return {
            id:         r.id,
            cafe:       r.venue_name || 'Unknown venue',
            zone:       '',
            score:      parseFloat(overall.toFixed(1)),
            scores: {
              food:     r.food     || 5,
              ambience: r.ambience || 5,
              service:  r.service  || 5,
              value:    r.value    || 5,
              wait:     r.wait_time || 5,
            },
            note:       r.note || null,
            verified:   r.verified  || false,
            flagged:    r.flagged   || false,
            trustLevel: r.trust_level || 'scout',
            reviewer:   r.reviewer  || '@anonymous',
            time:       snyfTimeAgo(r.created_at),
            daysAgo:    Math.floor((Date.now() - new Date(r.created_at)) / 86400000),
            reactions:  { accurate: 0, outdated: 0, helpful: 0 },
          };
        });

        // Merge DB reports into local reports array (avoid duplicates)
        dbReports.forEach(r => {
          if (!reports.find(existing => existing.id === r.id)) {
            reports.push(r);
          }
        });

        renderStats();
        renderReports();

      } catch (err) {
        dbError('loadReportsFromDB', err);
        // Fail silently — existing local reports still render
      }
    }

    async function submitReport() {
      const score    = Number(updateComposite());
      const place    = state.form.place;
      const reviewer = $('#handle-input').value.trim() || '@anonymous';
      const email    = $('#email-input').value.trim()  || null;
      const note     = $('#note-input').value.trim()   || null;

      const reportUser = await snyfGetUser();

      try {
        // Save to Supabase field_reports
        const { error } = await db.from('field_reports').insert({
          venue_name:  place,
          venue_id:    selectedVenueId,
          reviewer,
          email,
          user_id:     reportUser?.id  || null,
          trust_level: 'scout',
          food:        state.form.scores.food,
          ambience:    state.form.scores.ambience,
          service:     state.form.scores.service,
          value:       state.form.scores.value,
          wait_time:   state.form.scores.wait,
          note,
          verified:    false,
          flagged:     false,
          source:      'web',
        });

        if (error) throw error;

        // After successful insert, recompute trust level if logged in
        if (reportUser?.id) recomputeTrustLevel(reportUser.id);

        // Add to local reports array for immediate display
        reports.unshift({
          id:         Date.now(),
          cafe:       place.includes(',') ? place.split(',')[0].trim() : place,
          zone:       place.includes(',') ? place.split(',').pop().trim() : '',
          score,
          scores:     { ...state.form.scores },
          note:       note || 'No note added.',
          verified:   false,
          flagged:    false,
          trustLevel: 'scout',
          reviewer,
          time:       'just now',
          daysAgo:    0,
          reactions:  { accurate: 0, outdated: 0, helpful: 0 },
        });

      } catch (err) {
        dbError('submitReport', err);
        // Still show success — report added to local array even if DB save failed
      }

      $('#success-box').innerHTML = `
        &gt; Report submitted<br>
        &gt; Place: ${place}<br>
        &gt; Trust score: ${score.toFixed(1)}/7<br>
        &gt; Status: indexed in the Commons
      `;
      $$('.form-step').forEach(p => p.classList.toggle('active', p.dataset.step === 'success'));
      $$('[data-step-pill]').forEach(pill => pill.classList.add('active'));
      renderStats();
      renderReports();
    }

    async function loadActiveVenues() {
      try {
        const { data, error } = await db
          .from('venues')
          .select('id, name, zone')
          .eq('status', 'active')
          .order('sort_order', { ascending: true });

        if (error) throw error;

        if (data) {
          activeVenues = data;
          renderVenueChips(activeVenues.slice(0, 5));
        }
      } catch (err) {
        console.error('Error loading active venues:', err);
      }
    }

    function renderVenueChips(list) {
      const container = $('#quick-places');
      if (!container) return;

      container.innerHTML = list.map(v => {
        const fullPlace = v.zone ? `${v.name}, ${v.zone}` : v.name;
        return `<button class="quick-place" type="button" data-id="${v.id}" data-place="${fullPlace}">${v.name}</button>`;
      }).join('');

      // Add click events to chips
      container.querySelectorAll('.quick-place').forEach(button => {
        button.addEventListener('click', () => {
          container.querySelectorAll('.quick-place').forEach(item => item.classList.remove('active'));
          button.classList.add('active');
          setPlace(button.dataset.place, button.dataset.id);
        });
      });
    }

    function handleAutocomplete(query) {
      const dropdown = $('#autocomplete-list');
      if (!query.trim()) {
        dropdown.innerHTML = '';
        dropdown.style.display = 'none';
        return;
      }

      const matches = activeVenues.filter(v => 
        v.name.toLowerCase().includes(query.toLowerCase()) ||
        (v.zone && v.zone.toLowerCase().includes(query.toLowerCase()))
      );

      if (matches.length === 0) {
        dropdown.innerHTML = '';
        dropdown.style.display = 'none';
        return;
      }

      dropdown.innerHTML = matches.map(v => {
        const fullPlace = v.zone ? `${v.name}, ${v.zone}` : v.name;
        return `<div class="wr-autocomplete-item" data-id="${v.id}" data-place="${fullPlace}">${v.name} <span style="font-size:11px;opacity:0.6;margin-left:4px;">(${v.zone || ''})</span></div>`;
      }).join('');

      dropdown.style.display = 'block';

      // Click event for items
      dropdown.querySelectorAll('.wr-autocomplete-item').forEach(item => {
        item.addEventListener('click', () => {
          setPlace(item.dataset.place, item.dataset.id);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      sessionStorage.setItem('snyf_visited', 'true');
      renderStats();
      renderReports();
      loadReportsFromDB();
      renderSliders();
      updateComposite();
      loadActiveVenues();
      checkCurrentUser();

      // Update nav profile link if logged in
      snyfGetUser().then(async user => {
        if (user) {
          const profile = await snyfGetProfile(user.id);
          const name = profile?.name || user.email?.split('@')[0] || 'S';
          const navLink = document.getElementById('nav-profile-link');
          if (navLink) navLink.textContent = name[0].toUpperCase();
        }
      });

      $('#nav-write-btn').addEventListener('click', showForm);
      $('#hero-write-btn').addEventListener('click', showForm);
      $('#back-to-community').addEventListener('click', showBrowse);
      $('#success-back-btn').addEventListener('click', showBrowse);
      $('#new-report-btn').addEventListener('click', resetForm);

      $('#search-input').addEventListener('input', event => {
        state.search = event.target.value;
        renderReports();
      });

      $('#sort-select').addEventListener('change', event => {
        state.sort = event.target.value;
        renderReports();
      });

      $('#status-filters').addEventListener('click', event => {
        const button = event.target.closest('[data-filter]');
        if (!button) return;
        state.filter = button.dataset.filter;
        $$('#status-filters .ch-pill').forEach(item => item.classList.toggle('active', item === button));
        renderReports();
      });

      $('#zone-filters').addEventListener('click', event => {
        const button = event.target.closest('[data-zone]');
        if (!button) return;
        state.zone = button.dataset.zone;
        $$('#zone-filters .ch-pill').forEach(item => item.classList.toggle('active', item === button));
        renderReports();
      });

      $('#feed-list').addEventListener('click', event => {
        const button = event.target.closest('.ch-react');
        if (!button) return;
        
        const reactionType = button.dataset.reaction;
        const reportId = Number(button.dataset.id);
        const report = reports.find(r => r.id === reportId);
        
        if (report) {
          if (!button.classList.contains('reacted')) {
            button.classList.add('reacted');
            report.reactions[reactionType]++;
          } else {
            button.classList.remove('reacted');
            report.reactions[reactionType]--;
          }
          const span = button.querySelector('span');
          if (span) {
            span.textContent = report.reactions[reactionType];
          }
        }
      });

      // Load More Reports click simulation
      $('#load-more').addEventListener('click', () => {
        alert('All verified NCR intelligence feeds have been fully loaded.');
      });

      // Autocomplete & venue selection handler
      const placeInput = $('#place-input');
      placeInput.addEventListener('input', event => {
        const val = event.target.value;
        setPlace(val, null); // Clear selected id when user types manually
        handleAutocomplete(val);
      });

      // Close autocomplete dropdown on outside click
      document.addEventListener('click', e => {
        if (!e.target.closest('#place-input') && !e.target.closest('#autocomplete-list')) {
          $('#autocomplete-list').style.display = 'none';
        }
      });

      $('#step-1-next').addEventListener('click', () => goStep(2));
      $('#step-2-next').addEventListener('click', () => goStep(3));
      $('#step-3-next').addEventListener('click', () => goStep(4));
      $$('.back-step').forEach(button => button.addEventListener('click', () => goStep(button.dataset.back)));

      $('#sliders').addEventListener('input', event => {
        const input = event.target.closest('[data-score]');
        if (!input) return;
        state.form.scores[input.dataset.score] = Number(input.value);
        $(`#value-${input.dataset.score}`).textContent = Number(input.value).toFixed(1);
        updateComposite();
      });

      $('#note-input').addEventListener('input', event => {
        $('#char-count').textContent = event.target.value.length;
      });
      $('#handle-input').addEventListener('input', validateSubmit);
      $('#email-input').addEventListener('input', validateSubmit);
      $('#visited-input').addEventListener('change', validateSubmit);
      $('#submit-btn').addEventListener('click', submitReport);

      // ── Custom Cybernetic Cursor Tracking ───────────────────────────
      (function () {
        const isFinePointer = window.matchMedia('(pointer: fine)').matches;
        if (!isFinePointer) return;

        const dot = document.getElementById('cursor-dot');
        const ring = document.getElementById('cursor-ring');
        if (!dot || !ring) return;

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        
        let ringX = mouseX;
        let ringY = mouseY;
        let dotX = mouseX;
        let dotY = mouseY;

        window.addEventListener('mousemove', e => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        }, { passive: true });

        document.addEventListener('mouseleave', () => {
          dot.style.opacity = '0';
          ring.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
          dot.style.opacity = '1';
          ring.style.opacity = '1';
        });

        function updateCursor() {
          // Instant dot lock for zero lag feel
          dotX += (mouseX - dotX);
          dotY += (mouseY - dotY);
          dot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0)`;

          // Spring damped trailing ring
          ringX += (mouseX - ringX) * 0.15;
          ringY += (mouseY - ringY) * 0.15;
          ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;

          requestAnimationFrame(updateCursor);
        }
        requestAnimationFrame(updateCursor);

        // Hover effect for interactive elements on Snyf Commons
        const hoverTargets = 'a, button, input, select, textarea, [role="button"], .ch-card, .ch-pill, .ch-react, .quick-place';
        
        document.addEventListener('mouseover', e => {
          if (e.target && e.target.closest(hoverTargets)) {
            document.body.classList.add('cursor-hovering');
          }
        }, { passive: true });

        document.addEventListener('mouseout', e => {
          if (e.target && !e.target.closest(hoverTargets)) {
            document.body.classList.remove('cursor-hovering');
          }
        }, { passive: true });
      })();

      if (location.hash === '#write') showForm();
    });
  </script>
</body>
</html>
