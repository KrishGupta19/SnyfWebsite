[build]
  publish  = "."
  command  = "npm install"
  functions = "netlify/functions"

# ── HTTPS redirect ────────────────────────────────────────────
[[redirects]]
  from   = "http://snyf.co.in/*"
  to     = "https://snyf.co.in/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.snyf.co.in/*"
  to     = "https://snyf.co.in/:splat"
  status = 301
  force  = true

# ── Supabase Proxy to bypass ISP blocks ──────────────────────────
[[redirects]]
  from   = "/supabase-api/*"
  to     = "https://pjygywbgwujkvpexmxuu.supabase.co/:splat"
  status = 200
  force  = true

# ── Known static pages — must come BEFORE catch-all ──────────
[[redirects]]
  from   = "/community"
  to     = "/community.html"
  status = 200

[[redirects]]
  from   = "/discover"
  to     = "/discover.html"
  status = 200

[[redirects]]
  from   = "/admin"
  to     = "/admin/index.html"
  status = 200

[[redirects]]
  from   = "/profile"
  to     = "/profile.html"
  status = 200

# ── Venue admin catch-all → Café OS React app ─────────────────
# Handles EVERY venue admin URL automatically
# snyf.co.in/blue-tokai/admin → cafe-os/index.html?slug=blue-tokai
# snyf.co.in/ivy-and-bean/admin → cafe-os/index.html?slug=ivy-and-bean
[[redirects]]
  from   = "/:slug/admin"
  to     = "/cafe-os/index.html?slug=:slug"
  status = 200

# ── Venue page catch-all → universal venue template ───────────
# Handles EVERY venue URL automatically
# snyf.co.in/blue-tokai → venue.html?slug=blue-tokai
# snyf.co.in/ivy-and-bean → venue.html?slug=ivy-and-bean
[[redirects]]
  from   = "/:slug"
  to     = "/venue.html?slug=:slug"
  status = 200

# ── PWA \u2014 service worker + manifest headers ─────────────────────
[[headers]]
  for = "/cafe-os/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/cafe-os/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# ── Security headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    X-XSS-Protection           = "1; mode=block"
